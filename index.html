<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <header class="header">
    </header>
    <main class="main">
      <div class="pass" id="pass">
        <span class="pass_label">Пассажиры и класс</span>
        <span id="selected"></span>
        <div class="pass_select" id="menu">
            <ul>
                <li class="list">
                    <span>Взрослые</span>
                     <div class="list_btn-boxs">
                        <button type="button" class="list_btn minus" data-id="0">-</button>
                        <span data-id="0"  class="counter">0</span>
                        <button type="button" class="list_btn plus" data-id="0">+</button>
                     </div>
                </li>
                <li class="list">
                    <span>Дети</span>
                     <div class="list_btn-boxs">
                        <button type="button" class="list_btn minus" data-id="1" >-</button>
                        <span data-id="1"  class="counter">0</span>
                        <button type="button" class="list_btn plus" data-id="1">+</button>
                     </div>
                </li>
                <li class="list">
                    <span>Младенцы</span>
                     <div class="list_btn-boxs">
                        <button type="button" class="list_btn minus" data-id="2">-</button>
                        <span data-id="2" class="counter">0</span>
                        <button type="button" class="list_btn plus" data-id="2">+</button>
                     </div>
                </li>
            </ul>
        </div>
      </div>
    </main>
    <footer class="footer">
    </footer>
    <script src="./scripts/script.js"></script>
</body>
</html>
