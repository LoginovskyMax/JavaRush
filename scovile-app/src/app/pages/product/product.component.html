<p>Страница продукта</p>
<div class="product">
  <img [src]="product?.image" class="product__image">
  <p class="product__title">{{product?.title}}</p>
  <p class="product__price">{{product?.price}}</p>
  <p class="product__descr">{{product?.desc}}</p>
  <button (click)="addToBasket()">Add to Cart</button>
  <button (click)="goToBasket()">To Products Cart</button>
</div>
